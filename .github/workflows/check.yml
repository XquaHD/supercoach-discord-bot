name: SuperCoach Week Rollover Watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore snapshot state
        uses: actions/cache/restore@v4
        with:
          path: snapshot.json
          key: supercoach-snapshot-${{ github.run_id }}
          restore-keys: |
            supercoach-snapshot-

      - name: Seed auth_state.json from secret
        run: echo '${{ secrets.SUPERCOACH_AUTH_STATE_B64 }}' | base64 -d > auth_state.json

      - name: Run the check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check_and_notify.js

      - name: Save snapshot state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: snapshot.json
          key: supercoach-snapshot-${{ github.run_id }}
